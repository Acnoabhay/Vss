<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17191d"><title>VSS · Admin Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17191d;font:14px/1.5 system-ui,Arial}.top{background:#17191d;color:white;padding:17px 5%;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:30px auto;padding:0 16px}.panel{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:22px}.login{max-width:410px;margin:8vh auto}.field{display:grid;gap:6px;margin:14px 0}.field input,.search{padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit;width:100%}button{padding:11px 15px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.primary{background:#b51220;color:white}.hidden{display:none!important}.muted{color:#68707b}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.stats{display:flex;gap:12px;margin:18px 0}.stat{background:#fafafa;border:1px solid #eee;border-radius:12px;padding:15px;min-width:140px}.stat strong{display:block;font-size:24px}.tablewrap{overflow:auto;margin-top:16px}table{border-collapse:collapse;width:100%;min-width:800px}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee;font-size:12px}th{color:#68707b;text-transform:uppercase}.id{color:#b51220;font-weight:800}.msg{font-size:12px;color:#68707b;min-height:20px;margin-top:10px}@media(max-width:600px){.stats{flex-wrap:wrap}}
</style></head><body><header class="top"><b>VSS ADMINISTRATION</b><a href="membership.html" style="color:white">Public ID creation ↗</a></header><main class="wrap">
<section id="login" class="panel login"><div class="muted">RESTRICTED ACCESS</div><h1>Admin sign in</h1><p class="muted">Separate from public ID creation.</p><form id="loginForm"><div class="field"><label>Admin ID</label><input id="adminId" required placeholder="VSSADMIN"></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="primary" style="width:100%">Sign in</button></form><div id="loginMsg" class="msg"></div></section>
<section id="dashboard" class="hidden"><div class="bar"><div><div class="muted">VSS ADMIN PORTAL</div><h1>Member database</h1></div><button id="logout" class="primary">Sign out</button></div><div class="stats"><div class="stat"><strong id="total">0</strong><span>Total members</span></div><div class="stat"><strong id="today">0</strong><span>Today</span></div></div><div class="panel"><div class="bar"><h2>Registered members</h2><button id="export" class="primary">Export CSV</button></div><input id="search" class="search" placeholder="Search name, VSS ID, email, mobile or branch"><div class="tablewrap"><table><thead><tr><th>VSS ID</th><th>Name</th><th>Mobile</th><th>Email</th><th>Branch</th><th>Semester</th><th>Category</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div><div id="dashMsg" class="msg"></div></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://aukiryqoqpotjuuqwsec.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1a2lyeXFvcXBvdGp1dXF3c2VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNTk5MTcsImV4cCI6MjExMDkzNTkxN30.fqfDg2bU70gT3RpRp0cOYyZhusUwLuathrFI42p3v_w");
const ADMIN_ID="VSSADMIN",ADMIN_EMAIL="info.vsscommunity@gmail.com";let members=[];
const $=id=>document.getElementById(id);
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='Signing in…';if($('adminId').value.trim().toUpperCase()!==ADMIN_ID){$('loginMsg').textContent='Invalid admin ID or password.';return;}const {error}=await db.auth.signInWithPassword({email:ADMIN_EMAIL,password:$('password').value});if(error){$('loginMsg').textContent='Sign in failed. Check your configured admin password.';return;}await openDashboard();});
async function openDashboard(){const {data:{user}}=await db.auth.getUser();if(!user||user.email.toLowerCase()!==ADMIN_EMAIL){await db.auth.signOut();$('loginMsg').textContent='This account is not authorized.';return;}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await refresh();}
async function refresh(){ $('dashMsg').textContent='Loading…';const {data,error}=await db.from('vss_id_cards').select('*').order('created_at',{ascending:false});if(error){$('dashMsg').textContent='Could not load data. Run supabase/schema.sql and create the admin Auth user.';return;}members=data||[];$('total').textContent=members.length;$('today').textContent=members.filter(x=>new Date(x.created_at).toDateString()===new Date().toDateString()).length;render();$('dashMsg').textContent='';}
function render(){const q=$('search').value.toLowerCase();$('rows').innerHTML='';members.filter(m=>[m.membership_no,m.full_name,m.email,m.phone,m.branch,m.semester,m.membership_category].some(v=>String(v||'').toLowerCase().includes(q))).forEach(m=>{const tr=document.createElement('tr');[m.membership_no,m.full_name,m.phone,m.email,m.branch,m.semester,m.membership_category,new Date(m.created_at).toLocaleDateString()].forEach((v,i)=>{const td=document.createElement('td');td.textContent=v||'—';if(i===0)td.className='id';tr.append(td);});$('rows').append(tr);});}
$('search').addEventListener('input',render);$('export').addEventListener('click',()=>{const keys=['membership_no','full_name','father_name','phone','email','branch','semester','membership_category','created_at'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[keys.join(','),...members.map(m=>keys.map(k=>q(m[k])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='VSS-members.csv';a.click();URL.revokeObjectURL(a.href);});
$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.reload();});db.auth.getSession().then(({data})=>{if(data.session)openDashboard();});
</script></body></html>
